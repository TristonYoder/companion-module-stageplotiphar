name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      # Fails if package.json and companion/manifest.json disagree — the manifest
      # is what Companion shows users, and it had silently sat at 0.1.0 while
      # package.json said 0.2.3.
      - run: npm run check-version
      - run: npm run build
      # Pure unit tests — no server needed, unlike contract/, which the
      # StagePlotiphar repo runs against its own build.
      - run: npm run test:unit
      - run: npx companion-module-check
      - run: npx companion-module-build
